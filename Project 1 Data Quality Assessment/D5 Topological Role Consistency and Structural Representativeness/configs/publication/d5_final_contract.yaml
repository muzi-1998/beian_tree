version: d5-publication-contract-v1.2
confirmatory_run_id: D1D5V20-764c93bf3d95
random_seed: 20260817

score_contract:
  primary_scientific_score: D5_raw
  retrospective_report_score: D5_report_score
  scale: [1.0, 5.0]
  grade_bands_enabled: false
  missing_or_ood_policy: preserve_as_missing_and_report_coverage
  production_context_policy: plant_global_robust_context_MAP_hysteresis
  target_exclusion_claim: false

reference_contract:
  source: configs/local/templates.yaml
  key: reference_fraction
  endpoint_rule: inclusive_floor_n_times_fraction_minus_one

support_contract:
  L1: diagnostic_only
  L2: retrospective_scientific_report
  L3: gate_candidate_subject_to_node_validation
  missing_support_is_not_low_quality: true
  sensitivity_only:
    n_effective_multiplier: [0.8, 1.0, 1.2]
    node_reference_coverage: [0.70, 0.80, 0.90]
    node_bootstrap_stability: [0.75, 0.80, 0.85]

claim_boundaries:
  top1_localization_threshold: 0.80
  top1_failure_blocks: sensor_specific_hard_veto
  top1_failure_does_not_block: continuous_scientific_score
  process_coherence_role: attribution_guard_not_veto
  event_truth_status: unlabeled_candidate_events
  future_holdout_status: pending_new_data
  deployment_status: pending_documentary_audit_and_dual_approval

statistical_analysis:
  synchronized_block_hours: 168
  bootstrap_repetitions: 2000
  low_score_threshold: 3.0
  dependence_metrics: [spearman, kendall, partial_rank, low_score_jaccard]
  localization_metrics: [top1, top2, reciprocal_rank, topological_hop_error]
  overlap_scopes: [D5_report_score, D5_raw_calculable]
  overlap_strata: [analyte, regime, month, pair]
  minimum_stratum_pair_hours: 24
  minimum_stratum_time_blocks_descriptive: 2
  minimum_stratum_time_blocks_inferential: 6

d4_dependency:
  policy: fail_closed_exact_artifact_match
  expected_run_id: D4V151_20260813_083347
  expected_calibration_id: D4CAL-V151-66fe1bb6b7d3
  expected_main_scores_sha256: c21738a331d19632cc915e4d29cf692920aeccd346a6c74912f0f52dd4a9ca04
  require_single_run_id: true
  require_single_calibration_id: true

dimension_availability_sensitivity:
  availability_aware_score: Q_node
  fixed_dimension_score: Q_node_full
  complete_evidence_class: full
  current_numeric_dimensions: [D1, D2, D5]
  interpretation: prototype_to_repeat_after_final_D1_D5_aggregation

publication_figures:
  - FigD5_6_validation_coverage
  - FigD5_7_D4_D5_complementarity
  - FigD5_8_dimension_availability_sensitivity
  - FigD5_9_target_support_robustness
