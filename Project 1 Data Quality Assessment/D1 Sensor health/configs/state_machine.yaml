# D1 final-candidate causal event-level recovery state machine.

version: "1.3.0-final-candidate"

states:
  - Normal
  - Refractory
  - BaselinePending
  - SustainedAnomaly
  - RecoveryCandidate
  - Recovered

refractory:
  step_h: 48
  regime_h: 36
  drift_neutral_score: 3.0

event_uniqueness:
  min_separation_h: 24
  magnitude_change_pct: 30
  require_direction_change: false
  pelt_match_tolerance_h: 3
  require_pelt_for_retrigger: true

sustained_anomaly:
  candidate_window_search:
    step_after_h: [24, 72]
    regime_after_h: [48, 96]
    stable_window_h: 24
    stable_window_max_h: 48
    max_baseline_pending_h: 96
  baseline_init:
    use_robust: true
    center_estimator: "median"
    scale_estimator: "max(1.4826*MAD, empirical_noise, resolution)"
    drift_check: "theil_sen"
    drift_slope_threshold: 0.005
    scale_floor:
      method: "causal_empirical_calibration"
      calibration_h: 720
      rolling_h: 24
      noise_quantile: 0.25
      resolution_multiplier: 1.0
      epsilon: 0.000001
  thaw:
    duration_h: 36
    schedule: "linear"

recovery:
  enter_thresholds:
    Q_step_min: 3.0
    Q_regime_min: 3.0
    Q_freeze_min: 3.0
  trigger_thresholds:
    Q_step_max: 2.0
    Q_regime_max: 2.0
    Q_freeze_max: 2.0
  residual_check:
    max_z_score: 2.0
    peer_z_max: 2.5
    allow_contextual_regime: true
    use_w1_hard_gate: false
    max_w1_norm_diagnostic: 1.5
  evidence_window:
    entry_consecutive_h: 3
    retry_cooldown_h: 12
    required_pass_h: 12
    max_window_h: 18
    max_soft_fail_h: 2
    max_missing_h: 4
    max_consecutive_soft_fail_h: 1
  recovered_observation:
    duration_h: 24
    max_soft_fail_h: 4
    max_missing_h: 4
    max_total_nonpass_h: 4
    max_consecutive_soft_fail_h: 2
  direct_recovery:
    confirmation_h: 6

sustained_anomaly_cap: 2.5

audit_fields:
  - state_name
  - event_id
  - event_type
  - pelt_segment_id
  - refractory_start
  - refractory_end
  - baseline_pending_start
  - local_baseline_version
  - local_baseline_scale
  - recovery_streak
  - recovery_entry_streak
  - recovery_window_elapsed
  - recovery_soft_failures
  - recovery_missing
  - observation_elapsed
  - observation_passes
  - direct_recovery_streak
  - recovery_gate_status
  - regime_acceptance
  - accepted_contextual_regime
  - episode_outcome
