[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beian-d7"
version = "2.1.0"
requires-python = ">=3.10"
dependencies = [
  "jsonschema",
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "pyarrow",
  "python-docx",
  "pyyaml",
  "scikit-learn",
  "scipy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
