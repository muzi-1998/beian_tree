# D3 v2.3 rules. D3 is independent of D1 and D2 scores.

veto:
  veto_1:
    name: "hard_violation"
    trigger:
      hard_violation_rate_gt: 0.0
      OR_consecutive_min_gt: 5
    cap: 2.0
  veto_2:
    name: "instrument_range"
    trigger:
      out_of_instrument_range_any: true
    cap: 1.5
    usable_tag: "invalid"
  veto_3:
    name: "persistent_rate"
    trigger:
      rate_hard_violation_min_gt: 30
    cap: 2.5

decision_contract:
  instrument_range: "data_quality_fail"
  operational_hard_bound: "review_warning"
  operational_soft_bound: "operational_warning"
  persistent_rate: "operational_warning"
  process_coherent_shock: "guarded_process_diagnostic"
  provisional_operational_rules_exclude_training: false

evidence:
  min_observations: 30
  min_observed_fraction: 0.50
  on_insufficient: "not_evaluated"

usable_tag_rules:
  invalid_caps_below: 1.6
  review_only_below: 2.5
  report_only_below: 3.5
  train_ok_above_or_equal: 3.5

boundary_sticking:
  threshold_relative_margin: 0.05   # within 5% of hard range
  score_inclusion: false
