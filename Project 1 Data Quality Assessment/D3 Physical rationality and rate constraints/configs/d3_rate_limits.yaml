# d3_rate_limits.yaml
# Rate limits per sensor type; method config for dx_dt_robust

rate_estimator:
  method: "theil_sen"
  smooth_window: 5
  hampel_window: 7
  hampel_n_sigmas: 3.0

rate_limits:
  DO:
    rate_soft: 0.15
    rate_hard: 0.50
    unit: "mg/L/min"
    min_duration_min: 1
  ORP:
    rate_soft: 8.0
    rate_hard: 25.0
    unit: "mV/min"
    min_duration_min: 1

persistence:
  soft_same_sign_min: 3
  hard_same_sign_min: 10
  veto_same_sign_min: 30
  status: "provisional_expert_prior_pending_injection_and_site_validation"

impulse_return:
  enabled: true
  max_return_min: 3
  baseline_tolerance:
    DO: 0.05
    ORP: 5.0
  role: "D1_spike_owned_morphology_exclusion"

process_coherence_guard:
  enabled: true
  max_lag_min: 2
  exact_parallel_peer_sufficient: true
  minimum_same_line_peer_count: 2
  role: "attribution_guard_not_veto"

threshold_contract:
  status: "provisional_expert_prior"
  calibration_required: "position_and_operating_condition_specific"
  perturbation_multipliers: [0.8, 0.9, 1.0, 1.1, 1.2]

version: "v2.3.0"
