# Canonical raw observations are shared with section 1.1. D3 aligns them to the
# same clock but never consumes interpolated values or D1/D2 scores.
input:
  do_xlsx: "../1.1 Decomposition/Raw data/beian_min_1_DO_25-08-26-04.xlsx"
  orp_xlsx: "../1.1 Decomposition/Raw data/beian_min_2_ORP-08-26-04.xlsx"

time_grid:
  freq: "1min"
  expected_start: "2025-08-01 00:00:00"
  expected_end: "2026-04-13 23:59:00"

output:
  data: "outputs/data"
  figures: "outputs/figures"
  reports: "outputs/reports"
  manifest: "outputs/manifest/run_manifest.json"

threshold_library:
  path: "outputs/data/D3_threshold_library.xlsx"
