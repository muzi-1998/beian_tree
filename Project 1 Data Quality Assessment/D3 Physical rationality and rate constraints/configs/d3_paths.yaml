# Canonical raw observations are shared with section 1.1. D3 aligns them to the
# same clock but never consumes interpolated values or D1/D2 scores.
input:
  do_xlsx: "../1.1 Decomposition/Raw data/beian_min_1_DO_25-08-26-04.xlsx"
  orp_xlsx: "../1.1 Decomposition/Raw data/beian_min_2_ORP-08-26-04.xlsx"
  temperature_csv: "../1.1 Decomposition/Raw data/09_25.08.01-26.07.30_all data/整年对齐_分钟数据_2025-08-01_2026-07-30_01_influent+effluent.csv"

temperature:
  timestamp_column: "日期"
  value_column: "进水温度（℃）"
  datetime_format: "%Y-%m-%d %H:%M:%S"
  unit: "degC"
  valid_range_C: [0.0, 40.0]
  alignment: "exact_minute_no_interpolation_no_extrapolation"
  process_role: "minute_influent_temperature_proxy"
  invalid_value_policy: "mask_outside_valid_range_and_audit"
  calibration_hour_min_valid_minutes: 30

time_grid:
  freq: "1min"
  expected_start: "2025-08-01 00:00:00"
  expected_end: "2026-04-13 23:59:00"

output:
  data: "outputs/data"
  figures: "outputs/figures"
  reports: "outputs/reports"
  manifest: "outputs/manifest/run_manifest.json"

threshold_library:
  path: "outputs/data/D3_threshold_library.xlsx"
