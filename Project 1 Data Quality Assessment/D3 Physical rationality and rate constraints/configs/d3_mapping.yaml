# d3_mapping.yaml
# evidence -> 1-5 quality score mapping

mapping_version: "v2.4.0"
zero_violation_anchor: true

Q_value_hard:
  type: "logistic"
  # exceedance_rate -> Q score: 0 -> 5, high -> 1
  x0: 0.01
  k: 200.0

Q_value_soft:
  type: "logistic"
  x0: 0.10
  k: 15.0

Q_persistent_rate:
  type: "two_level_logistic"
  soft_only:
    x0: 0.05
    k: 20.0
  hard:
    x0: 0.05
    k: 20.0
  component_weights:
    soft_only: 0.30
    hard: 0.70
  evidence_contract: "mutually_exclusive_soft_only_episode_and_hard_persistent_core"

aggregation:
  weights:
    Q_value_hard: 0.50
    Q_value_soft: 0.20
    Q_persistent_rate: 0.30
  lambda_base: 0.75    # D3_pre = lambda*base + (1-lambda)*min
  status: "frozen_v2.3_weights_with_v2.4_rate_construct_update"
  candidate_rebalance_sensitivity_only:
    Q_value_hard: 0.45
    Q_value_soft: 0.35
    Q_persistent_rate: 0.20
  candidate_reason_not_promoted: "large_ORP3_soft-bound_reclassification_without_external_labels"

diagnostics:
  legacy_aliases:
    Q_rate: "Q_persistent_rate"
  boundary_behavior:
    included_in_score: false
    reason: "Boundary occupancy overlaps D1 floor/freeze and D4 tail-distribution evidence."
