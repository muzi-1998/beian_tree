# d3_mapping.yaml
# evidence -> 1-5 quality score mapping

mapping_version: "v2.3.0"
zero_violation_anchor: true

Q_value_hard:
  type: "logistic"
  # exceedance_rate -> Q score: 0 -> 5, high -> 1
  x0: 0.01
  k: 200.0

Q_value_soft:
  type: "logistic"
  x0: 0.10
  k: 15.0

Q_persistent_rate:
  type: "logistic"
  x0: 0.05
  k: 20.0

aggregation:
  weights:
    Q_value_hard: 0.50
    Q_value_soft: 0.20
    Q_persistent_rate: 0.30
  lambda_base: 0.75    # D3_pre = lambda*base + (1-lambda)*min

diagnostics:
  legacy_aliases:
    Q_rate: "Q_persistent_rate"
  boundary_behavior:
    included_in_score: false
    reason: "Boundary occupancy overlaps D1 floor/freeze and D4 tail-distribution evidence."
