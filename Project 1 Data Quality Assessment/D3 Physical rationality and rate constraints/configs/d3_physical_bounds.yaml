# d3_physical_bounds.yaml
# Instrument limits and provisional operating envelopes for independent D3.

sensors:
  DO:
    hard_low: -0.2
    hard_high: 20.0
    soft_low: 0.0
    soft_high: null
    soft_sensitivity_anchor: "lower"
    unit: "mg/L"
    manufacturer_range_low: 0.0
    manufacturer_range_high: 20.0
    instrument_veto_range_low: -0.2
    instrument_veto_range_high: 20.0
    instrument_veto_basis: "registered_range_with_negative_numeric_tolerance"
  ORP:
    hard_low: -500.0
    hard_high: 500.0
    soft_low: -400.0
    soft_high: 200.0
    soft_sensitivity_anchor: "center"
    unit: "mV"
    manufacturer_range_low: -1500.0
    manufacturer_range_high: 1500.0
    instrument_veto_range_low: -1500.0
    instrument_veto_range_high: 1500.0
    instrument_veto_basis: "registered_range"

sensor_overrides:
  DO_1_4:
    process_zone: "post_anoxic"
    physical_soft_low: 0.0
    zero_equivalence_low: -0.05
    operational_soft_high: null
    soft_sensitivity_anchor: "none"
    physical_low_basis: "nonnegative_dissolved_oxygen_concentration"
    zero_equivalence_basis: "resolution_derived_provisional_zero_point_tolerance"
    upper_bound_basis: "pending_post_anoxic_template_validation"
  DO_2_4:
    process_zone: "post_anoxic"
    physical_soft_low: 0.0
    zero_equivalence_low: -0.05
    operational_soft_high: null
    soft_sensitivity_anchor: "none"
    physical_low_basis: "nonnegative_dissolved_oxygen_concentration"
    zero_equivalence_basis: "resolution_derived_provisional_zero_point_tolerance"
    upper_bound_basis: "pending_post_anoxic_template_validation"

operational_envelope_contract:
  status: "mixed_frozen_site_calibration_and_provisional_expert_prior"
  score_role: "operational_warning_not_instrument_failure"
  aerobic_do_temperature_conditioned_upper:
    enabled: true
    status: "frozen_time_blocked_site_calibration"
    scope: "aerobic_DO_positions_1_to_3"
    covariate: "minute_influent_temperature_proxy"
    interpretation: "temperature_conditioned_operational_warning_not_thermodynamic_saturation_limit"
    saturation_reference:
      equation: "14.652-0.41022*T+0.007991*T^2-0.000077774*T^3"
      medium: "freshwater"
      pressure_assumption: "standard_atmosphere"
      salinity_assumption: "zero"
      valid_temperature_C: [0.0, 40.0]
    calibration:
      grouping: "longitudinal_position_across_parallel_lines"
      start: "2025-08-01 00:00:00"
      end_exclusive: "2026-02-01 00:00:00"
      validation_start: "2026-02-01 00:00:00"
      validation_end_exclusive: "2026-04-01 00:00:00"
      terminal_start: "2026-04-01 00:00:00"
      terminal_end_exclusive: "2026-04-14 00:00:00"
      quality_filter: "D1_total,Q_spike,Q_step,Q_freeze,Q_regime,D2_Strict>=4.5_and_D2_usable"
      DO_hourly_statistic: "mean"
      estimator: "max(P99,median+3x1.4826MAD)_of_DO_over_Csat"
      minimum_valid_temperature_minutes_per_hour: 30
      minimum_calibration_sensor_hours: 720
      alpha_by_position:
        "1": 0.2870480956
        "2": 0.3146109551
        "3": 0.4898265899
      calibration_support_sensor_hours:
        "1": 1137
        "2": 2238
        "3": 2547
      scored_positions: ["1", "2"]
      diagnostic_only_positions: ["3"]
      promotion_rule: "independent_validation_high_quality_warning_rate_le_0.02_per_sensor"
      position_3_status: "diagnostic_only_failed_temporal_stability_DO_2_3"
    runtime_missing_policy: "upper_component_not_evaluated_no_extrapolation"
    external_validity_limit: "requires_in_basin_temperature_pressure_salinity_and_cross_plant_validation"
  orp_soft_range:
    status: "pending_position_and_regime_validation"
    position_groups: ["anaerobic", "anoxic_mid", "anoxic_end"]
    position_conditioned_envelopes_role: "diagnostic_only_until_site_review"
  do4_zero_equivalence:
    provisional_value_mg_L: -0.05
    sensitivity_values_mg_L: [0.0, -0.03, -0.05, -0.10]
    physical_soft_low_mg_L: 0.0
    production_upper_bound: null
    production_upper_bound_status: "disabled_pending_time_blocked_post_anoxic_template_validation"
    final_lock_requires: "manufacturer_accuracy_or_zero_oxygen_calibration"

sources:
  operational_bounds: "expert_operational_limits_pending_site_validation"
  instrument_register:
    source_id: "provided_instrument_installation_register"
