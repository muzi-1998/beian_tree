# d3_physical_bounds.yaml
# Instrument limits and provisional operating envelopes for independent D3.

sensors:
  DO:
    hard_low: -0.2
    hard_high: 20.0
    soft_low: 0.0
    soft_high: 8.0
    unit: "mg/L"
    manufacturer_range_low: 0.0
    manufacturer_range_high: 20.0
    instrument_veto_range_low: -0.2
    instrument_veto_range_high: 20.0
    instrument_veto_basis: "registered_range_with_negative_numeric_tolerance"
  ORP:
    hard_low: -500.0
    hard_high: 500.0
    soft_low: -400.0
    soft_high: 200.0
    unit: "mV"
    manufacturer_range_low: -1500.0
    manufacturer_range_high: 1500.0
    instrument_veto_range_low: -1500.0
    instrument_veto_range_high: 1500.0
    instrument_veto_basis: "registered_range"

sensor_overrides:
  DO_1_4:
    process_zone: "post_anoxic"
    soft_low: -0.05
    zero_deadband_low: -0.05
    basis: "resolution_derived_provisional_zero_deadband"
  DO_2_4:
    process_zone: "post_anoxic"
    soft_low: -0.05
    zero_deadband_low: -0.05
    basis: "resolution_derived_provisional_zero_deadband"

operational_envelope_contract:
  status: "provisional_expert_prior"
  score_role: "operational_warning_not_instrument_failure"
  do_soft_high_8_mg_L:
    status: "pending_temperature_pressure_salinity_validation"
    seasonal_diagnostic_required: true
  orp_soft_range:
    status: "pending_position_and_regime_validation"
    position_groups: ["anaerobic", "anoxic_mid", "anoxic_end"]
    position_conditioned_envelopes_role: "diagnostic_only_until_site_review"
  do4_zero_deadband:
    provisional_value_mg_L: -0.05
    sensitivity_values_mg_L: [0.0, -0.03, -0.05, -0.10]
    final_lock_requires: "manufacturer_accuracy_or_zero_oxygen_calibration"

sources:
  operational_bounds: "expert_operational_limits_pending_site_validation"
  instrument_register:
    source_id: "provided_instrument_installation_register"
    source_sha256: "2085f4de640aa0231f95e3abe370dec6d1da9c3daf064e6f05042e344ca58ea9"
    inspected_sheet_range: "Sheet1!A1:P34"
    reverified_at: "2026-07-27T00:00:00+08:00"
version: "v2.3.0"
effective_date: "2026-08-06"
