# d2_mapping.yaml
# 映射函数 + 子分权重 + 短长断点策略(P2 外置:替代 ENG_DEFAULTS 硬编码)
# 各厂可有自己的初始值;运行时仍由 d2_calibration.yaml 覆盖关键阈值。

mapping_version: d2_v4_strict_hard_availability_r1

timestamp_quality:
  expected_interval_sec: 60
  jitter_tolerance_sec: 5
  gap_interval_min_sec: 120
  denominator: valid_adjacent_raw_timestamp_transitions
  long_interval_role: Q_GS_diagnostic_only

# ─── 子分到 1-5 分的分段映射(工程初始值) ───
piecewise_breaks:
  Q_TI:
    missing_rate:       [0.005, 0.02,  0.05,  0.15, 0.25]
    duplicate_rate:     [0.001, 0.005, 0.01,  0.05, 0.09]
    out_of_order_rate:  [0.001, 0.005, 0.01,  0.05, 0.09]
    true_irregular_rate: [0.005, 0.02, 0.05, 0.10, 0.15]
  Q_GS:
    L_max_min:        [5,     15,    60,    360, 660]
    P95_gap_min:      [3,     8,     30,    120, 210]
    gap_run_count:    [2,     5,     15,    40, 65]
  Q_HA:
    hard_stasis_fraction_observed: [0.02, 0.08, 0.20, 0.50, 0.80]

# ─── Q_TI 内部加权 ───
Q_TI_components:
  weights:
    missing:          0.65
    true_irregular:   0.25
    duplicate:        0.05
    out_of_order:     0.05
  unavailable_component_policy: conditional_weight_normalisation

# ─── Q_GS 内部加权(P1-A 修订) ───
Q_GS_components:
  weights:
    L_max:          0.50
    P95_gap:        0.30   # ← 原代码漏掉,P1-A 补回
    gap_run_count:  0.20

# ─── Q_FA 主+辅证据规则 ───
Q_HA_rule:
  main_metric: hard_stasis_fraction_observed
  denominator: observed_raw_minutes
  production_semantics: present_raw_and_resolution_equivalent_persistent_stasis
  aggravation:
    metric:           response_loss_rate
    trigger_above:    0.30
    main_threshold:   4.0    # 仅当 Q_main ≤ 4 时才下调
    downgrade_amount: 1
    production_enabled: false
    role: diagnostic_only_owned_by_D1_sensor_health

# ─── D2 主聚合(方案 v2.0 §4.2 锁定值) ───
aggregation:
  weights:
    Q_TI: 0.30
    Q_GS: 0.30
    Q_HA: 0.40
  lambda_blend: 0.70
  unavailable_subscore_policy: conditional_weight_normalisation

# ─── Veto 上限 ───
veto_rules:
  Lmax_p99:
    upper_cap: 2.0
    metric:    L_max_min
    threshold_key: L_max_minutes
  missing_p99:
    upper_cap: 1.8
    metric:    missing_rate
    threshold_key: missing_rate
  hard_stasis_severe:
    upper_cap: 2.5
    metric:    Q_HA
    threshold: 2.0
    comparator: "<="

# ─── Safety floor(P0 新增:防止 benchmark 退化为 0)───
safety_floor:
  L_max_minutes:   360
  missing_rate:    0.15

# ─── 插补策略 ───
imputation:
  short_gap_max_min:    5
  long_gap_min_min:     6
  short_method:         linear
  long_action:          no_impute
  ledger_required:      true

# ─── 信息停滞阈值(D1-D2 分流) ───
freeze_detection:
  tau_rle_D2_min:    3     # soft-stasis diagnostic only
  tau_rle_D1_min:    15    # hard observed-value stasis; production Q_FA
  tau_iqr_DO:        0.02
  tau_iqr_ORP:       1.0

process_floor_policy:
  qha_window: freeze_window
  production_evidence: [present_raw_and_hard_observed_stasis]
  hard_rle_min: 15
  low_iqr_diagnostic_only: true
  floor_occupancy_diagnostic_only: true
  response_loss_requires_comparable_peer: true

standard_availability_policy:
  production_evidence: [present_raw_and_hard_observed_stasis]
  soft_rle_diagnostic_only: true
  low_iqr_diagnostic_only: true
  response_loss_diagnostic_only: true

dynamic_information_sufficiency:
  role: sensitive_diagnostic_only
  independent_evidence_families:
    intrinsic_low_dynamics: [low_iqr, soft_rle]
    comparable_peer_response_loss: [response_loss]
  intrinsic_window_fraction: 0.50
  response_loss_rate: 0.30
  minimum_independent_families: 2
  persistence_hours: 2
  production_score_penalty: none
