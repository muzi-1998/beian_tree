[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beian-dqr-aggregation"
version = "2.1.0"
description = "Evidence-aware D1-D5 wastewater data-quality aggregation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
