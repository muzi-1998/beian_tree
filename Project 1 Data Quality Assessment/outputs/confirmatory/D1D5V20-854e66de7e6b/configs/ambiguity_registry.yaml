schema_version: ww-dqs-ambiguity-registry-v2.0
items:
  - ambiguity_id: A-D1-PEER-MARGIN
    scope: D1_peer_admission
    scheme_text: no_material_tail_degradation_and_not_significantly_worse
    issue: The v2.0 prose omitted the numeric admission rule already used by the D1 peer-upgrade implementation.
    execution_policy: lock_the_existing_2pct_gain_zero_ci_lower_bound_60pct_positive_folds_and_5pct_p90_tail_margin_in_the_SAP
    status: resolved_by_existing_D1_validation_contract
    recommended_resolution: retain the frozen rule; do not add a post-hoc P95 endpoint without a new development protocol.
  - ambiguity_id: A-D1-RESOLUTION
    scope: D1_degraded_resolution_injections
    scheme_text: original_resolution_plus_one_degraded_resolution_level
    issue: The degraded resolution increment is not numerically specified.
    execution_policy: use_paired_2x_native_or_empirical_resolution_as_exploratory_sensitivity_only
    status: pending_instrument_and_SCADA_encoding_metadata
    recommended_resolution: lock the degraded increment from instrument resolution and SCADA encoding metadata before confirmatory reuse.
  - ambiguity_id: A-D1-INJECTION-ROUTE
    scope: D1_fault_injection_preprocessing
    scheme_text: inject_in_raw_domain_then_rerun_decomposition_whitening_and_scoring
    issue: The original implementation labelled every route-level trial as raw-domain even though spike, step and drift entered different detector routes.
    execution_policy: label_all_primary_trials_by_their_true_route_and_add_a_64_scenario_per_fault_raw_domain_frozen_transform_audit
    status: resolved_by_route_truth_and_no_leakage_audit
    recommended_resolution: keep route-level applicability and raw-domain concordance as separate evidence layers; never refit on a contaminated window.
  - ambiguity_id: A-D4-SHRINKAGE
    scope: D4_ORP_hierarchical_shrinkage
    scheme_text: lambda_depends_on_effective_blocks_and_estimation_variance
    issue: The estimator, prior strength and minimum independent block count are not specified.
    execution_policy: run sensitivity_only_without_replacing_D4_raw
    status: pending_method_lock
    recommended_resolution: select one empirical-Bayes estimator in development data, freeze it, then test it in future blocks.
  - ambiguity_id: A-D4-FAR
    scope: D4_common_process_guard
    scheme_text: keep_conditional_new_far_low
    issue: Low is qualitative in the work-package table.
    execution_policy: use_existing_locked_0_10_ceiling
    status: resolved_by_existing_locked_contract
    recommended_resolution: retain 0.10 in the frozen SAP and cite the originating D4 validation contract.
  - ambiguity_id: A-D4-LAG-RESOLUTION
    scope: D4_change_point_lag_validation
    scheme_text: validate_0_10_30_60_180_minute_lags
    issue: The production change-point timeline is hourly, so 10 and 30 minute lag levels are below its nominal resolution.
    execution_policy: remove_subhour_levels_from_main_claim_and_retain_the_existing_grid_as_supplementary_resolution_sensitivity
    status: resolved_for_current_manuscript_scope
    recommended_resolution: a future minute-scale auxiliary detector is required before making 10 or 30 minute identification claims.
  - ambiguity_id: A-D5-NODE-SUPPORT
    scope: D5_L3_admission
    scheme_text: prespecified_node_level_independent_time_blocks
    issue: The v2.0 document did not state the numeric minimum.
    execution_policy: retain_current_D5_v2_3_support_contract_and_copy_exact_thresholds_into_the_SAP
    status: resolved_by_v2_3_contract_lock
    recommended_resolution: cite the frozen SAP and D5 v2.3 support contract together.
  - ambiguity_id: A-D5-CONTEXT-ABLATION
    scope: D5_context_and_template_ablation
    scheme_text: remove_qr_qir_time_hysteresis_and_fixed_regime_then_rerun
    issue: The v2.0 document did not define K selection or the exact reduced set of structural refits.
    execution_policy: run_full_reference_no_exogenous_no_regime_and_no_hysteresis_with_training_only_silhouette_K_and_frozen_future_month_tests
    status: resolved_by_prespecified_outer_refit_protocol
    recommended_resolution: retain only these three high-value ablations and do not search feature combinations using Top1.
  - ambiguity_id: A-COMP-BOTTLENECK
    scope: composite_conservative_gate
    scheme_text: Q_min_below_3_for_2_to_3_hours
    issue: The primary persistence is given as a range.
    execution_policy: use_3h_as_primary_and_2h_as_sensitivity_without_releasing_an_operational_action_gate
    status: resolved_for_retrospective_analysis
    recommended_resolution: preserve the same rule in the manuscript SAP; deployment still requires prospective validation.
  - ambiguity_id: A-COMP-GRADE
    scope: composite_A_to_E_grades
    scheme_text: thresholds_frozen_before_confirmatory_testing
    issue: No composite grade cut points are supplied.
    execution_policy: publish_continuous_scores_and_coverage_only
    status: pending_threshold_lock
    recommended_resolution: lock grade cut points using development-period utility or expert criteria, never the confirmatory blocks.
  - ambiguity_id: A-D3-SOFT-SOURCE
    scope: D3_soft_and_rate_thresholds
    scheme_text: design_literature_or_expert_approved_rules
    issue: Existing rules are versioned but several remain expert rules without signed site approval.
    execution_policy: retain_as_Grade_B_warning_only
    status: pending_site_expert_approval
    recommended_resolution: add named source, date, applicable condition and reviewer sign-off to the threshold register.
