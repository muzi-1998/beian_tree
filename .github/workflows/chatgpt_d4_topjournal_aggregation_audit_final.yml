name: Build final D4 top-journal and aggregation audit

on:
  push:
    branches:
      - chatgpt/d4-topjournal-aggregation-audit-20260813
    paths:
      - '.github/workflows/chatgpt_d4_topjournal_aggregation_audit_final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/d4-topjournal-aggregation-audit-20260813
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install python-docx pillow lxml
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk fonts-liberation

      - name: Correct reference attribution and build Word report
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.chatgpt_d4_readiness_audit/build_report.py')
          text=p.read_text(encoding='utf-8')
          old="8. Schneider, M. Y. et al. (2019). Characterizing long-term wear and tear of ion-selective pH sensors. Water Science and Technology. DOI: 10.2166/wst.2019.301."
          new="8. Ohmura, K., Thürlimann, C. M., Kipf, M., Carbajal, J. P., & Villez, K. (2019). Characterizing long-term wear and tear of ion-selective pH sensors. Water Science and Technology, 80(3), 541–550. DOI: 10.2166/wst.2019.301."
          assert old in text
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
          python .chatgpt_d4_readiness_audit/build_report.py

      - name: Verify DOCX package and embedded repository figures
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('deliverables/260813_D4_顶刊SCI发表与最终DQR聚合_方法学缺口_四项问题审查_修改完善方案_专家版.docx')
          assert p.exists() and p.stat().st_size > 500000
          with zipfile.ZipFile(p) as z:
              media=[n for n in z.namelist() if n.startswith('word/media/')]
              assert len(media) >= 5, media
              xml=z.read('word/document.xml').decode('utf-8')
              assert 'Ohmura' in xml
              assert 'Schneider, M. Y. et al. (2019). Characterizing long-term wear' not in xml
          print('verified',p.stat().st_size,'bytes; media=',len(media))
          PY

      - name: Render and inspect document
        run: |
          mkdir -p deliverables/rendered
          rm -f deliverables/rendered/260813_D4_顶刊SCI发表与最终DQR聚合_方法学缺口_四项问题审查_修改完善方案_专家版.pdf deliverables/rendered/page-*.png
          libreoffice --headless --convert-to pdf --outdir deliverables/rendered deliverables/260813_D4_顶刊SCI发表与最终DQR聚合_方法学缺口_四项问题审查_修改完善方案_专家版.docx
          pdfinfo deliverables/rendered/260813_D4_顶刊SCI发表与最终DQR聚合_方法学缺口_四项问题审查_修改完善方案_专家版.pdf | tee deliverables/rendered/pdfinfo.txt
          pdftoppm -png -r 90 deliverables/rendered/260813_D4_顶刊SCI发表与最终DQR聚合_方法学缺口_四项问题审查_修改完善方案_专家版.pdf deliverables/rendered/page >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          pages=sorted(Path('deliverables/rendered').glob('page-*.png'))
          assert len(pages) >= 10, len(pages)
          issues=[]
          for p in pages:
              im=Image.open(p).convert('L')
              mean=ImageStat.Stat(im).mean[0]
              lo,hi=im.getextrema()
              if mean>253.8 or lo>245:
                  issues.append((p.name,mean,(lo,hi)))
          Path('deliverables/rendered/page_qa.txt').write_text(f'pages={len(pages)}\nnear_blank_issues={issues}\n',encoding='utf-8')
          print('pages',len(pages),'issues',issues)
          assert not issues
          PY

      - name: Commit final deliverables
        run: |
          rm -f deliverables/rendered/page-*.png
          git checkout -- .chatgpt_d4_readiness_audit/build_report.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/*.docx deliverables/rendered/*.pdf deliverables/rendered/*.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Build final D4 top-journal and aggregation readiness audit'
            git push origin HEAD:chatgpt/d4-topjournal-aggregation-audit-20260813
          fi

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4_topjournal_aggregation_readiness_audit_FINAL
          path: |
            deliverables/260813_D4_顶刊SCI发表与最终DQR聚合_方法学缺口_四项问题审查_修改完善方案_专家版.docx
            deliverables/rendered/260813_D4_顶刊SCI发表与最终DQR聚合_方法学缺口_四项问题审查_修改完善方案_专家版.pdf
            deliverables/rendered/pdfinfo.txt
            deliverables/rendered/page_qa.txt
          if-no-files-found: error
